[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsb2"
dynamic = ["version"]
description = "Simulating Night Sky Background for Imaging Air Cherenkov Telescopes"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Gerrit Roellinghoff", email = "gerrit.roellinghoff@fau.de"}
]
maintainers = [
    {name = "Gerrit Roellinghoff", email = "gerrit.roellinghoff@fau.de"}
]
keywords = [
    "night-sky-background",
    "nsb",
    "cherenkov",
    "telescope",
    "iact",
    "astronomy",
    "astrophysics",
    "simulation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.11"

# Bounds are chosen to overlap ctapipe's, so that nsb2 and ctapipe resolve to
# a common environment: ctapipe pins astropy>=6.1,<9, numpy>=1.26,<3 and
# scipy~=1.15. The upper bounds guard against the next major release of each
# dependency, which is where the array and unit protocols nsb2 relies on have
# historically changed.
dependencies = [
    "astropy>=6.1,<9.0.0",
    "dust_extinction>=1.3",
    "healpy>=1.16.0",
    "numpy>=1.26,<3.0.0",
    "scikit-learn>=1.1,!=1.4.0",
    "scipy>=1.11,<2.0.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-doctestplus>=0.12",
]
docs = [
    "furo",
    "myst-nb",
    "numpydoc",
    "sphinx",
    "sphinx-automodapi",
    "sphinx-design",
]
dev = [
    "nsb2[docs,tests]",
    "commitizen>=3.12.0",
    "mypy>=1.0",
    "pre-commit",
    "ruff>=0.6.0",
    "jupyter>=1.0",
    "matplotlib",
    "ctapipe",
]

[project.urls]
Homepage = "https://github.com/GerritRo/nsb2"
Documentation = "https://gerritro.github.io/nsb2/"
Repository = "https://github.com/GerritRo/nsb2.git"
Issues = "https://github.com/GerritRo/nsb2/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nsb2*"]

[tool.setuptools.package-data]
nsb2 = ["py.typed", "data/*"]
"nsb2.instrument" = ["response/*.npz", "bandpass/*.dat"]
"nsb2.core.tests" = ["resources/*.npz"]

[tool.setuptools.dynamic]
version = {attr = "nsb2.__version__"}

[tool.mypy]
# No python_version pin: numpy's bundled stubs use syntax that only parses
# under the interpreter they ship for, so mypy must follow the interpreter.
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["nsb2"]
follow_imports = "silent"

# Tests deliberately pass wrong types to check that the errors are raised.
[[tool.mypy.overrides]]
module = ["nsb2.*.tests.*", "nsb2.conftest"]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "D",    # pydocstyle
    "T10",  # flake8-debugger
    "T20",  # flake8-print: log, do not print
    "RUF",  # ruff-specific rules
]
ignore = [
    "D105",  # magic methods are documented where they are not self-evident
    "D107",  # __init__ is documented in the class docstring
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "E501",  # line length is enforced by the formatter
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"docs/examples/*" = ["D", "E402", "I", "N", "T20"]
"nsb2/*/tests/*" = ["D101", "D102", "D103", "D401", "N803", "T201"]
"nsb2/conftest.py" = ["D401"]
"nsb2/instrument/CTAO.py" = ["N802", "N999"]
"nsb2/instrument/HESS.py" = ["N802", "N999"]
"nsb2/core/photometry.py" = ["N802", "N803", "N806"]
"nsb2/core/spectral.py" = ["N802"]
"nsb2/atmosphere/single_scattering.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["nsb2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["nsb2"]
python_files = ["test_*.py"]
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--doctest-modules",
    "-m",
    "not remote_data",
]
doctest_plus = "enabled"
markers = [
    "remote_data: test requires network access to external data services",
]
filterwarnings = [
    "error::astropy.utils.exceptions.AstropyDeprecationWarning",
]

[tool.coverage.run]
omit = [
    "nsb2/__init__*",
    "nsb2/conftest.py",
    "nsb2/*/tests/*",
    "nsb2/version*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    # Bodies of abstract methods and Protocol members; there is nothing to
    # execute, but coverage counts them as statements.
    '^\s*\.\.\.$',
]

[tool.codespell]
ignore-words-list = "nd,als,ND,aas"

# -- Commitizen (conventional commits + changelog) --
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = [
    "nsb2/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
