name: CI

on:
  push:
    branches: [main,dev]
  pull_request:
    branches: [main,dev]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy nsb2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[tests]"
      - name: Run tests
        run: pytest --cov=nsb2 --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # Guards the lower bounds declared in pyproject.toml: without this the
  # floors drift and "pip install nsb2" silently stops working on older,
  # still-supported dependency versions.
  test-oldest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install oldest supported dependencies
        run: |
          pip install -e ".[tests]"
          pip install \
            "astropy==6.1.*" \
            "dust_extinction==1.3" \
            "healpy==1.16.*" \
            "numpy==1.26.*" \
            "scikit-learn==1.1.*" \
            "scipy==1.11.*"
      - name: Run tests
        run: pytest

  # nsb2 must stay co-installable with ctapipe: a resolver conflict here means
  # nsb2 cannot be used from a ctapipe analysis.
  test-with-ctapipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install alongside ctapipe
        run: pip install -e ".[tests]" ctapipe
      - name: Check the environment is consistent
        run: pip check
      - name: Run tests
        run: pytest

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Build docs
        run: cd docs && make html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
